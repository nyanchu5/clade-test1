version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ugc-video-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SORA_API_KEY=${SORA_API_KEY}
      - SORA_API_URL=${SORA_API_URL:-https://api.sora.com/v2}
      - DATABASE_PATH=/app/data/database.sqlite
      - VIDEOS_DIR=/app/videos
      - UPLOADS_DIR=/app/uploads
      - FRONTEND_URL=http://localhost
    volumes:
      - ./data:/app/data
      - ./videos:/app/videos
      - ./uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ugc-video-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
  videos:
  uploads:
